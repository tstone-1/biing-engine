name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      BIING_MIDI_OUT: none
      BIING_FIXES: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl3
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-sdl3
      - name: Build and test C on macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build and test C on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Verify Python runtime and generated edition tables
        run: |
          uv run --no-project python -c "import sys; assert sys.version_info[:3] == (3, 15, 1); print(sys.version)"
          uv run --no-project python -I tools/engine_editions.py --check
      - name: Test import, launcher, trainer and package notices with synthetic data
        run: uv run --no-project --with pytest python -m pytest -q -rs -p no:cacheprovider tests/test_biing_cdrom.py tests/test_launcher.py tests/test_play.py tests/test_biing_inspector.py tests/test_package_notices.py tests/test_sign_macos.py tests/test_sign_windows.py
